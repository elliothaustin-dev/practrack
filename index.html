<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PracTrack — Gestión de Prácticas Profesionales</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===================== AUTH (pantallas públicas) ===================== -->
  <div id="auth-shell" class="auth-shell">
    <!-- Login -->
    <section id="view-login" class="auth-card">
      <h1>PracTrack</h1>
      <p class="muted">Gestión de prácticas profesionales</p>
      <form id="form-login">
        <label>Correo
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label>Contraseña
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn-primary">Iniciar sesión</button>
      </form>
      <p class="muted small">¿No tienes cuenta?
        <a href="#register" data-link>Regístrate</a>
      </p>
      <button type="button" id="btn-demo" class="btn btn-ghost">Entrar como demo (estudiante)</button>
    </section>

    <!-- Registro -->
    <section id="view-register" class="auth-card hidden">
      <h1>Crear cuenta</h1>
      <form id="form-register">
        <label>Nombre completo
          <input type="text" name="nombre" required>
        </label>
        <label>Correo
          <input type="email" name="email" required>
        </label>
        <label>Contraseña
          <input type="password" name="password" required minlength="8">
        </label>
        <label>Rol
          <select name="rol">
            <option value="estudiante">Estudiante</option>
            <option value="empresa">Empresa</option>
            <option value="profesor">Profesor asesor</option>
          </select>
        </label>
        <button type="submit" class="btn btn-primary">Registrarme</button>
      </form>
      <p class="muted small">¿Ya tienes cuenta?
        <a href="#login" data-link>Inicia sesión</a>
        <button type="button" id="btn-demo" class="btn btn-ghost">Entrar como demo (estudiante)</button>
      <button type="button" id="btn-demo-empresa" class="btn btn-ghost">Entrar como demo (empresa)</button>

      </p>
    </section>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app-shell" class="app-shell hidden">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">PracTrack</div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <span id="user-email" class="muted small"></span>
        <button id="btn-logout" class="btn btn-ghost">Cerrar sesión</button>
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <h2 id="view-title">Dashboard</h2>
        <span id="role-badge" class="badge"></span>
      </header>

      <!-- ============ Vistas ============ -->

      <!-- Dashboard -->
      <section id="view-dashboard" class="view">
        <div class="grid grid-3" id="dashboard-cards"></div>
      </section>

      <!-- Perfil -->
      <section id="view-perfil" class="view hidden">
        <form id="form-perfil" class="card">
          <h3>Mi perfil</h3>
          <div id="perfil-fields" class="grid grid-2"></div>
          <div class="row">
            <button type="submit" class="btn btn-primary">Guardar cambios</button>
          </div>
        </form>
      </section>

      <!-- Estudiante: vacantes -->
      <section id="view-vacantes" class="view hidden">
        <div class="toolbar">
          <input id="search-vacantes" type="search" placeholder="Buscar vacantes...">
          <select id="filter-area"><option value="">Área</option></select>
          <select id="filter-modalidad"><option value="">Modalidad</option></select>
        </div>
        <div id="vacantes-list" class="grid grid-2"></div>
      </section>

      <!-- Estudiante: detalle de vacante -->
      <section id="view-vacante-detalle" class="view hidden">
        <div id="vacante-detalle" class="card"></div>
      </section>

      <!-- Estudiante: recomendaciones -->
      <section id="view-recomendaciones" class="view hidden">
        <p class="muted">Vacantes ordenadas por compatibilidad con tu perfil.</p>
        <div id="recomendaciones-list" class="grid grid-2"></div>
      </section>

      <!-- Estudiante: postulaciones -->
      <section id="view-postulaciones" class="view hidden">
        <div class="card">
          <table class="table" id="postulaciones-table">
            <thead>
              <tr>
                <th>Vacante</th><th>Empresa</th><th>Fecha</th><th>Estado</th><th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- Estudiante: correo con IA -->
      <section id="view-correo-ia" class="view hidden">
        <div class="card">
          <h3>Asistente de correo de presentación</h3>
          <label>Vacante
            <select id="ia-vacante"><option value="">Selecciona una vacante</option></select>
          </label>
          <div class="row">
            <button id="btn-generar-correo" class="btn btn-primary">Generar borrador</button>
          </div>
          <label>Borrador (editable)
            <textarea id="ia-correo-texto" rows="12"
              placeholder="El borrador aparecerá aquí..."></textarea>
          </label>
          <div class="row">
            <button id="btn-guardar-correo" class="btn">Guardar</button>
            <button id="btn-copiar-correo" class="btn btn-ghost">Copiar</button>
          </div>
        </div>
      </section>

      <!-- Empresa: mis vacantes -->
      <section id="view-mis-vacantes" class="view hidden">
        <div class="toolbar">
          <button id="btn-nueva-vacante" class="btn btn-primary">+ Nueva vacante</button>
        </div>
        <div id="mis-vacantes-list" class="grid grid-2"></div>
      </section>

      <!-- Empresa: postulaciones recibidas -->
      <section id="view-postulaciones-recibidas" class="view hidden">
        <div id="postulaciones-recibidas-list" class="grid"></div>
      </section>

      <!-- Profesor: prácticas -->
      <section id="view-practicas" class="view hidden">
        <div id="practicas-list" class="grid"></div>
      </section>

      <!-- Admin: empresas pendientes -->
      <section id="view-admin-empresas" class="view hidden">
        <div id="admin-empresas-list" class="grid"></div>
      </section>

      <!-- Admin: usuarios -->
      <section id="view-admin-usuarios" class="view hidden">
        <div class="card">
          <table class="table" id="admin-usuarios-table">
            <thead>
              <tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <!-- Admin: reportes -->
      <section id="view-admin-reportes" class="view hidden">
        <div class="grid grid-3" id="reportes-cards"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
